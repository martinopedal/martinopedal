name: Update README

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    # Path filter prevents the auto-PR's eventual merge from re-triggering
    # this workflow. Only changes to the script or this workflow file run it.
    paths:
      - scripts/update-readme.ps1
      - .github/workflows/update-readme.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, personal-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Refresh README from public repos
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/update-readme.ps1

      - name: Open or update PR with changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README.md unchanged. Nothing to do."
            exit 0
          fi

          BRANCH="chore/readme-auto-refresh"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "chore: refresh repo list in README" \
                     -m "Auto-generated by .github/workflows/update-readme.yml" \
                     -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push --force --set-upstream origin "$BRANCH"

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: refresh repo list in README" \
              --body "Automated refresh of the auto-generated section in README.md by [\`update-readme.yml\`](.github/workflows/update-readme.yml). Review the diff and merge if it looks right."
          else
            echo "PR #$existing already open. Branch updated."
          fi
